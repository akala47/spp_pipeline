# Astro CLI reads this file together with its own docker-compose file.
#
# extra_hosts: on a Linux VPS, Docker does not define host.docker.internal.
#   This line adds it, so the containers can reach the Postgres server on the
#   host with SPP_DSN=postgresql://...@host.docker.internal:5432/spp.
# shm_size: the Beatrice scraper starts Chromium inside the scheduler
#   container (tasks run there with the LocalExecutor). The old Chrome
#   options do not include --disable-dev-shm-usage, so give Chromium a
#   larger /dev/shm than the Docker default of 64 MB.
services:
  scheduler:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "1gb"
  dag-processor:
    extra_hosts:
      - "host.docker.internal:host-gateway"
  api-server:
    extra_hosts:
      - "host.docker.internal:host-gateway"
  triggerer:
    extra_hosts:
      - "host.docker.internal:host-gateway"
