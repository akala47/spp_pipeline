# This file allows you to configure Airflow Connections, Pools, and Variables in a single place for local development only.
# NOTE: json dicts can be added to the conn_extra field as yaml key value pairs. See the example below.

# For more information, refer to our docs: https://www.astronomer.io/docs/astro/cli/develop-project#configure-airflow_settingsyaml-local-development-only
# For questions, reach out to: https://support.astronomer.io
# For issues create an issue ticket here: https://github.com/astronomer/astro-cli/issues

airflow:
  connections:
    - conn_id:
      conn_type:
      conn_host:
      conn_schema:
      conn_login:
      conn_password:
      conn_port:
      conn_extra:
        example_extra_field: example-value
  pools:
    - pool_name:
      pool_slot:
      pool_description:
  # Keep every entry here empty. `astro dev start` and `astro dev restart`
  # send these objects to the Airflow API as the user admin:admin. Airflow
  # now asks for a real login (FAB auth manager, DEPLOY_VPS.md step 16), so
  # that request fails, and then the Astro command fails too (also the
  # systemd unit and the nightly deploy). With empty entries, Astro sends no
  # request. Set Variables with `astro dev run variables set ...` (step 9).
  # The groups fall back to SPP_RT_LMP_GROUPS in .env, then config/groups.json.
  variables:
    - variable_name:
      variable_value:
